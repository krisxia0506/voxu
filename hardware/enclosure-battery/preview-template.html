<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOXU · 分层装配预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111820;color:#e7edf4;font:15px system-ui}main{display:grid;grid-template-columns:290px 1fr;height:100vh}aside{padding:24px;background:#1b2531;overflow:auto}h1{font-size:22px;margin:0 0 8px}p{color:#a9bacb;line-height:1.6}button{background:#34495f;color:white;border:0;border-radius:7px;padding:9px 12px;cursor:pointer;margin:3px}input[type=range]{width:100%;margin:15px 0}label.part{display:flex;gap:9px;align-items:center;margin:15px 0;font-size:13px}i{width:10px;height:10px;border-radius:50%}canvas{width:100%;height:100%;display:block;touch-action:none}section{position:relative;min-width:0}.hint{position:absolute;bottom:18px;left:22px;pointer-events:none;color:#c0ccd8;font-size:13px}small{color:#a9bacb;line-height:1.7;display:block}#error{color:#ffb99b}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:40vh 60vh}aside{padding:16px}.parts{display:grid;grid-template-columns:1fr 1fr}}</style>
<main><aside><h1>VOXU 分层装配</h1><p>居中充电口版 4 · 62 × 46 × 31.4 mm<br>真实 CAD 网格 · 离线可用</p><strong>拆解程度 <output id="value">0%</output></strong><input id="explode" aria-label="拆解程度" type="range" min="0" max="100" value="0"><div><button id="assemble">合拢</button><button id="split">完全拆解</button><button id="base">只看底座</button><button id="reset">重置视角</button></div><p>显示零件</p><div class="parts" id="parts"></div><small>拖动旋转，滚轮缩放。拆解沿竖直方向展示层次，不代表实际拆装路径。电子件为外形包络；固定强度需打印试装确认。</small><p id="error"></p></aside><section><canvas id="view" aria-label="可旋转的三维装配模型"></canvas><div class="hint">鼠标拖动旋转 · 滚轮缩放 · 左侧滑块分层拆解</div></section></main>
<script>
const data=/*ASSEMBLY_DATA*/;
const canvas=document.querySelector('#view'),gl=canvas.getContext('webgl',{antialias:true});
if(!gl){document.querySelector('#error').textContent='当前浏览器未启用 WebGL，请在 Chrome 或 Safari 中打开。';throw Error('WebGL unavailable')}
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,`attribute vec3 pos;attribute vec3 normal;uniform vec3 center;uniform vec3 right;uniform vec3 up;uniform vec3 toward;uniform float zoom;uniform float aspect;uniform float lift;varying float light;void main(){vec3 p=pos+vec3(0.,0.,lift)-center;gl_Position=vec4(dot(p,right)/(zoom*aspect),dot(p,up)/zoom,-dot(p,toward)/600.,1.);light=.48+.52*abs(dot(normal,normalize(vec3(-.4,-.6,1.))));}`));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`precision mediump float;uniform vec3 color;varying float light;void main(){gl_FragColor=vec4(color*light,1.);}`));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const locations={};for(const n of ['center','right','up','toward','zoom','aspect','lift','color'])locations[n]=gl.getUniformLocation(program,n);
const pa=gl.getAttribLocation(program,'pos'),na=gl.getAttribLocation(program,'normal');
for(const [i,d] of data.entries()){d.visible=true;for(const key of ['positions','normals']){d[key+'Buffer']=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,d[key+'Buffer']);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(d[key].flat()),gl.STATIC_DRAW)}const label=document.createElement('label');label.className='part';const check=document.createElement('input');check.type='checkbox';check.checked=true;check.addEventListener('change',()=>{d.visible=check.checked;draw()});d.check=check;const swatch=document.createElement('i');swatch.style.background=`rgb(${d.color.map(x=>Math.round(x*255)).join(',')})`;label.append(check,swatch,document.createTextNode(d.name));document.querySelector('#parts').append(label)}
let angle=-2.15,elevation=.66,zoom=53,explosion=0;
function draw(){const ratio=Math.min(devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*ratio),h=Math.round(canvas.clientHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clearColor(.067,.094,.125,1);gl.enable(gl.DEPTH_TEST);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const right=[-Math.sin(angle),Math.cos(angle),0],up=[-Math.sin(elevation)*Math.cos(angle),-Math.sin(elevation)*Math.sin(angle),Math.cos(elevation)],toward=[Math.cos(elevation)*Math.cos(angle),Math.cos(elevation)*Math.sin(angle),Math.sin(elevation)];for(const [n,v] of Object.entries({right,up,toward,center:[31,23,17+explosion*42]}))gl.uniform3fv(locations[n],v);gl.uniform1f(locations.zoom,(zoom+explosion*45)*Math.max(1,h/w));gl.uniform1f(locations.aspect,w/h);for(const d of data){if(!d.visible)continue;gl.uniform1f(locations.lift,d.level*14*explosion);gl.uniform3fv(locations.color,d.color);for(const [a,key] of [[pa,'positions'],[na,'normals']]){gl.bindBuffer(gl.ARRAY_BUFFER,d[key+'Buffer']);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0)}gl.drawArrays(gl.TRIANGLES,0,d.positions.length)}}
const slider=document.querySelector('#explode');function split(v){slider.value=v;explosion=v/100;document.querySelector('#value').textContent=v+'%';draw()}slider.addEventListener('input',()=>split(+slider.value));document.querySelector('#assemble').onclick=()=>split(0);document.querySelector('#split').onclick=()=>split(100);document.querySelector('#base').onclick=()=>{data.forEach((d,i)=>{d.visible=i===0;d.check.checked=d.visible});split(0)};document.querySelector('#reset').onclick=()=>{angle=-2.15;elevation=.66;zoom=53;data.forEach(d=>{d.visible=true;d.check.checked=true});split(0)};
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;angle-=(e.clientX-drag[0])*.009;elevation=Math.max(-1.5,Math.min(1.5,elevation+(e.clientY-drag[1])*.009));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(15,Math.min(160,zoom*Math.exp(e.deltaY*.001)));draw()},{passive:false});new ResizeObserver(draw).observe(canvas);draw();
</script></html>
